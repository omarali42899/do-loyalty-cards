<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DO Wallet · Test</title><style>body{font-family:Arial,sans-serif;background:#f0e7d8;color:#39291f;padding:30px}main{max-width:560px;margin:5vh auto;background:#faf6ee;border:1px solid #d4c2b1;border-radius:20px;padding:25px}button,input{font:inherit;padding:12px;border-radius:9px}button{background:#39291f;color:white;border:0;cursor:pointer}input{width:95%;margin:10px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#743f48}</style></head><body><main><p>DO SPECIALITY COFFEE</p><h1>Google Wallet · Test</h1><p>Owner-only pilot. No real customer cards yet.</p><button id="check">Check Wallet connection</button><p id="status">Open DO Coffee Club in this browser and sign in as owner first.</p><section id="card" hidden><label>Test customer QR token (UUID only)<input id="token" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><button id="create">Create test Wallet link</button><p id="result"></p></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const URL='https://ibzfjptgwwjodphliyeg.supabase.co';const KEY='sb_publishable_J9-7_HwOBhFtDbcAquPkTA_f3vYmZcm';const sb=createClient(URL,KEY);const $=id=>document.getElementById(id);
async function call(action,qr_token){const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in as owner at the main DO Coffee Club page first.');let response=await fetch(URL+'/functions/v1/do-wallet-test',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({action,qr_token})});let json=await response.json();if(!response.ok)throw Error(json.error||'Wallet check failed');return json}
$('check').onclick=async()=>{$('status').textContent='Checking secure Google connection…';try{const d=await call('check');$('status').textContent=d.credential_valid?'Google authentication OK. Class HTTP status: '+d.class_http_status+(d.class_found?' · Loyalty class found.':' · Class not found or inaccessible; review Wallet class setup next.'):'Google connection unavailable';$('card').hidden=!d.class_found}catch(e){$('status').textContent='Error: '+e.message}};
$('create').onclick=async()=>{$('result').textContent='Preparing test link…';try{const d=await call('link',$('token').value.trim().replace(/^DOCLUB:/i,''));const link=document.createElement('a');link.href=d.save_url;link.textContent='Add test card to Google Wallet';link.target='_blank';link.rel='noopener noreferrer';$('result').replaceChildren(link)}catch(e){$('result').textContent='Error: '+e.message}};
</script></body></html>
